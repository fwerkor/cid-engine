[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cid-engine"
version = "0.1.0"
description = "Semantics-preserving execution engine for Continuous Interaction Diffusion"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "fwerkor" }]
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
cid-engine-bench = "cid_engine.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cid_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
