[build-system]
requires = ["setuptools>=77", "wheel", "torch>=2.4"]
build-backend = "setuptools.build_meta"

[project]
name = "cid-engine"
version = "0.2.0"
description = "C++20 execution engine for Continuous Interaction Diffusion"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "fwerkor" }]
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
cid-engine-bench = "cid_engine.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
